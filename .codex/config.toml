# Codex CLI 設定 (dotfiles 管理 / scripts/link.sh で ~/.codex/ にリンク)
# 認証は ChatGPT ログイン (`codex login`)。auth.json は生成物なので git 管理しない。
preferred_auth_method = "chatgpt"

# model は未指定 — Codex CLI の既定モデルを使う

# workspace 外への書き込みとネットワークアクセスを遮断する
# (Claude Code 側の permissions.deny と同等の制約をサンドボックス側でも表現する)
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
